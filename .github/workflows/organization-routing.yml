name: organization-routing

on:
  pull_request:
    paths:
      - "ORGANIZATION_ROUTING.md"
      - "ORG_CONTEXT.md"
      - "README.md"
      - "docs/PROJECTS.md"
      - "organization-routing.json"
      - "profile/README.md"
      - "schema/organization-routing.schema.json"
      - "schema/project-registry-artifact.schema.json"
      - "scripts/build-project-registry.py"
      - "tests/organization-routing.test.mjs"
      - "tests/test_project_registry.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "ORGANIZATION_ROUTING.md"
      - "ORG_CONTEXT.md"
      - "README.md"
      - "docs/PROJECTS.md"
      - "organization-routing.json"
      - "profile/README.md"
      - "schema/organization-routing.schema.json"
      - "schema/project-registry-artifact.schema.json"
      - "scripts/build-project-registry.py"
      - "tests/organization-routing.test.mjs"
      - "tests/test_project_registry.py"
      - ".github/workflows/**"
  schedule:
    - cron: "37 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate every workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"
      - name: Parse routing JSON and schemas
        run: |
          set -euo pipefail
          node -e 'JSON.parse(require("node:fs").readFileSync("organization-routing.json", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("schema/organization-routing.schema.json", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("schema/project-registry-artifact.schema.json", "utf8"))'
      - name: Run organization routing contracts
        run: node --test tests/organization-routing.test.mjs
      - name: Run project registry contracts
        run: python3 -m unittest discover -s tests -p 'test_project_registry.py' -v
      - name: Prove verification leaves the checkout unchanged
        run: git diff --exit-code -- .
