name: bootstrap-org-project

on:
  pull_request:
    paths:
      - ".github/workflows/export-gh-cli.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove one-use CLI export artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in 8944220730 8944290894; do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}" >/dev/null 2>&1 || true
          done
      - name: Create or resolve the canonical organization project
        id: project
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TITLE: 3FA-app Delivery
        run: |
          set -euo pipefail
          mkdir -p result
          gh --version > result/gh-version.txt
          gh project list --owner 3FA-app --format json --limit 100 > result/projects-before.json
          number=$(jq -r --arg title "$PROJECT_TITLE" '.projects[] | select(.title == $title) | .number' result/projects-before.json | head -n1)

          if [ -z "$number" ]; then
            set +e
            gh project create --owner 3FA-app --title "$PROJECT_TITLE" --format json > result/create.json 2> result/create-error.txt
            status=$?
            set -e
            printf '%s\n' "$status" > result/create-exit-code.txt
            if [ "$status" -eq 0 ]; then
              number=$(jq -r '.number' result/create.json)
            fi
          else
            printf '0\n' > result/create-exit-code.txt
            printf '{"number":%s,"title":%s,"reused":true}\n' "$number" "$(jq -Rn --arg value "$PROJECT_TITLE" '$value')" > result/create.json
            : > result/create-error.txt
          fi

          if [ -n "${number:-}" ]; then
            gh project edit "$number" \
              --owner 3FA-app \
              --description "Canonical GitHub delivery board for 3FA-app. Linear project github.com/3FA-app remains the planning system of record." \
              --readme $'# 3FA-app Delivery\n\nGitHub execution board for repositories in the `3FA-app` organization.\n\n- Linear project: https://linear.app/denman/project/githubcom3fa-app-c3db52220894\n- Organization routing: https://github.com/3FA-app/.github/blob/main/ORGANIZATION_ROUTING.md\n- Slack channel: https://oresoftware-workspace.slack.com/archives/C0BL6BEDYFK\n\nLinear owns planning, priority, dependencies, and long-form status. GitHub Projects owns repository execution visibility. Missing mappings fail closed.' \
              --visibility PRIVATE \
              --format json > result/project.json

            gh project link "$number" --owner 3FA-app --repo 3FA-app/.github > result/link.txt 2> result/link-error.txt || true

            gh project field-list "$number" --owner 3FA-app --format json --limit 100 > result/fields-before.json
            for field in "Linear issue" "Linear project" "Repository role"; do
              if ! jq -e --arg field "$field" '.fields[] | select(.name == $field)' result/fields-before.json >/dev/null; then
                case "$field" in
                  "Repository role")
                    gh project field-create "$number" --owner 3FA-app --name "$field" --data-type SINGLE_SELECT \
                      --single-select-options "governance,interfaces,clients,backend,web,desktop,sync,infra,e2e,mcp,website,extension,monorepo" \
                      --format json >> result/created-fields.jsonl
                    ;;
                  *)
                    gh project field-create "$number" --owner 3FA-app --name "$field" --data-type TEXT --format json >> result/created-fields.jsonl
                    ;;
                esac
              fi
            done

            gh project item-add "$number" --owner 3FA-app --url "https://github.com/3FA-app/.github/pull/${{ github.event.pull_request.number }}" --format json > result/item.json 2> result/item-error.txt || true
            gh project view "$number" --owner 3FA-app --format json > result/project-final.json
            gh project field-list "$number" --owner 3FA-app --format json --limit 100 > result/fields-final.json
            printf '%s\n' "$number" > result/project-number.txt
          else
            printf 'Project creation failed; see create-error.txt.\n' > result/project-final.txt
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: org-project-bootstrap-result
          path: result/
          if-no-files-found: error
          retention-days: 1
